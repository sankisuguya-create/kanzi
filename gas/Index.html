<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字の森</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=block">
<style>
/* 色は color-coding スキルの既定トークン。識別に使う色は2重符号化（語・記号・形）と組にする */
:root {
  --ink: #1A1A1A;
  --ink-sub: #616870;
  --ink-link: #0F5EA8;
  --ink-alert: #C0330A;
  --cat-1: #0F5EA8;
  --cat-2: #C86A00;
  --cat-3: #6E4310;
  --fill-a: #D7E8F8;
  --fill-b: #FBE3B4;
  --solid-on: #0F5EA8;
  --paper: #FBF9F4;
  --card: #FFFFFF;
  --line: #C9CDD2;
  /* 木の色は装飾（識別に使わない） */
  --leaf-0: #4E8A3E; --leaf-1: #6BA34F; --leaf-2: #3F7535;
  /* フォントは1か所で決める。一般的な日本語フォントを並べ、中国語フォントに落ちないように最後は日本語ゴシックにする */
  --font-sans: "BIZ UDPGothic", "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "IPAexGothic", "IPAPGothic", "IPAGothic", "MoriJP", "Noto Sans JP", sans-serif;
  --font-kanji: "UD Digi Kyokasho N-R", "BIZ UDMincho", "Noto Serif JP", "Noto Serif CJK JP", "Hiragino Mincho ProN", "Yu Mincho", "IPAexMincho", "IPAMincho", var(--font-sans); /* 漢字を大きく見せる所: 教科書体 → 明朝 → ゴシック */
  --tap: 64px; /* 児童のタップ対象の下限より大きく（評価軸 §2） */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-sans);
  font-size: 20px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 1100px; margin: 0 auto; padding: 12px 16px 24px; min-height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; } /* フォーム部品も同じ日本語フォントを引き継ぐ */
button:focus-visible { outline: 4px solid var(--cat-1); outline-offset: 2px; }

/* ---- 見出し */
.top { display: flex; align-items: baseline; gap: 14px; padding: 4px 4px 8px; }
.top h1 { margin: 0; font-size: 34px; letter-spacing: .06em; color: var(--cat-3); }
.top .sub { margin: 0; color: var(--ink-sub); font-size: 18px; }
.demo-note { text-align: center; color: var(--ink-sub); font-size: 15px; }

/* ---- ボタン */
.big {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  width: 100%; min-height: 104px; padding: 12px 16px;
  font-size: 30px; font-weight: 700; letter-spacing: .08em;
  background: var(--card); border: 3px solid var(--ink); border-radius: 18px;
}
.big.primary { background: var(--solid-on); border-color: var(--solid-on); color: #fff; }
.big .meta { font-size: 18px; font-weight: 400; letter-spacing: 0; }
.big .next-chars { font-size: 22px; letter-spacing: .3em; }
.big:active { transform: translateY(2px); }
.done-note { font-size: 22px; font-weight: 400; border-style: dashed; border-color: var(--line); color: var(--ink-sub); }

/* ---- メニュー */
.menu { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: center; }
.tree-box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 4px; }
.tree { width: 100%; height: auto; display: block; }
.tree-cap { margin: 2px 0 6px; text-align: center; font-size: 18px; }
.tree-cap b { font-size: 24px; }
.tree-cap .sep { display: inline-block; width: 18px; }
.ico-leaf, .ico-fruit { display: inline-block; vertical-align: -2px; margin-right: 4px; }
.ico-leaf { width: 18px; height: 10px; border-radius: 50%; background: var(--leaf-1); transform: rotate(-25deg); }
.ico-fruit { width: 14px; height: 14px; border-radius: 50%; background: var(--cat-2); border: 1.5px solid var(--cat-3); }
.actions { display: grid; gap: 18px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.two .big { font-size: 26px; min-height: 96px; }
.big[disabled] { opacity: .45; cursor: default; }
.t-ground { fill: #E6DDC8; }
.t-trunk { fill: var(--cat-3); }
.t-branch { fill: none; stroke: var(--cat-3); stroke-linecap: round; }
.t-leaf.l0 { fill: var(--leaf-0); } .t-leaf.l1 { fill: var(--leaf-1); } .t-leaf.l2 { fill: var(--leaf-2); }
.t-sprout { fill: var(--leaf-1); }
.t-fruit { fill: var(--cat-2); stroke: var(--cat-3); stroke-width: 1; }
.t-new { transform-box: fill-box; transform-origin: center; animation: pop .5s ease-out both; }
@keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.5); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .t-new { animation: none; } }

/* ---- 上のバー */
.bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 10px; }
.bar button { min-height: 56px; min-width: 110px; padding: 0 16px; font-size: 20px; border: 2px solid var(--line); background: var(--card); border-radius: 12px; }
.bar .prog { text-align: center; color: var(--ink-sub); font-size: 20px; }

/* ---- よむ */
.read { display: grid; gap: 18px; justify-items: center; }
.card {
  width: min(100%, 720px); min-height: 46vh; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 18px;
}
.card .word { font-family: var(--font-kanji); line-height: 1.1; }
.card .tg { font-size: clamp(96px, 22vmin, 190px); }
.card .ot { font-size: clamp(56px, 12vmin, 110px); }
.card .kana { font-size: 40px; letter-spacing: .15em; visibility: hidden; min-height: 1.3em; }
.card.flipped .kana { visibility: visible; }
.card .tap-hint { position: absolute; bottom: 12px; color: var(--ink-sub); font-size: 18px; }
.card.flipped .tap-hint { visibility: hidden; }
.answer { display: grid; gap: 8px; width: min(100%, 720px); }
.answer .q { font-size: 20px; font-weight: 700; }
.answer-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
#yomi { min-height: 76px; font-size: 40px; padding: 0 16px; letter-spacing: .1em; border: 3px solid var(--ink); border-radius: 14px; background: var(--card); font-family: inherit; min-width: 0; }
#yomi:focus { outline: 4px solid var(--cat-1); outline-offset: 2px; }
#yomi[readonly] { background: var(--paper); }
.answer .btn-ok { min-width: 160px; font-size: 26px; font-weight: 700; border-radius: 14px; }
.rmsg { min-height: 1.5em; margin: 0; font-size: 26px; font-weight: 700; }
.rmsg.good { color: var(--cat-1); }
.rmsg.ng, .rmsg.ans { color: var(--ink-alert); }
.after { display: flex; gap: 14px; align-items: center; width: min(100%, 720px); justify-content: flex-end; }
.after .big { width: auto; min-width: 240px; min-height: 76px; }
.after .btn-mada { min-height: 60px; padding: 0 22px; font-size: 20px; border-radius: 12px; }
.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: min(100%, 720px); visibility: hidden; }
.judge.show { visibility: visible; }
.judge button { min-height: 92px; font-size: 30px; font-weight: 700; border-radius: 18px; letter-spacing: .1em; }
.btn-mada { background: var(--card); border: 3px solid var(--ink); }
.btn-ok { background: var(--solid-on); border: 3px solid var(--solid-on); color: #fff; }
.speak { min-height: 56px; padding: 0 22px; font-size: 20px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; }

/* ---- 書字パッド */
.padbox { width: min(62vh, 520px, calc(100vw - 32px)); aspect-ratio: 1; margin: 0 auto; }
.pv-pad .padbox { width: min(52vh, 440px, calc(100vw - 32px)); }
.pad { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; background: var(--card); border-radius: 12px; }
.pad-frame { fill: none; stroke: var(--ink); stroke-width: 1; }
.pad-grid { stroke: var(--line); stroke-width: .6; stroke-dasharray: 2 2; }
.pad-guide path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
.pad-guide .g-hide { display: none; }
.pad-guide .g-all { stroke: #D5D8DC; }
.pad-guide .g-next { stroke: #9FC3E6; }
.pad-guide .g-demo { stroke: var(--ink); stroke-width: 4.5; }
.start-dot { fill: var(--cat-1); }
.pad-ink polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4.5; }
.stroke-live, .stroke-ok { stroke: var(--ink); }
.stroke-miss { stroke: var(--ink-alert); stroke-dasharray: 3 3; opacity: .8; transition: opacity .4s; }

/* ---- かく */
.write { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; }
.wl { display: grid; gap: 10px; align-content: start; }
.prompt { margin: 0; font-size: 56px; font-family: var(--font-kanji); }
.prompt .box { display: inline-block; width: 1em; height: 1em; border: 3px solid var(--ink); vertical-align: -0.1em; background: var(--fill-b); }
.prompt rt { font-size: 24px; font-family: var(--font-sans); letter-spacing: .1em; }
.prompt-kana { margin: 0; color: var(--ink-sub); font-size: 22px; letter-spacing: .1em; }
.stages { display: flex; gap: 8px; list-style: none; padding: 0; margin: 4px 0; flex-wrap: wrap; }
.stages li { padding: 4px 12px; border: 2px solid var(--line); border-radius: 999px; color: var(--ink-sub); font-size: 18px; }
.stages li.cur { border-color: var(--ink); color: var(--ink); font-weight: 700; background: var(--fill-a); }
.stages li.past::after { content: " ✓"; }
.msg { min-height: 1.6em; margin: 0; font-size: 22px; font-weight: 700; }
.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.tools button { min-height: var(--tap); padding: 0 20px; font-size: 20px; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; }
.result { display: grid; gap: 10px; }
.res { margin: 0; font-size: 34px; font-weight: 700; }
.res.good { color: var(--cat-1); }
.res.again { color: var(--ink); }
.res-note { margin: 0; color: var(--ink-sub); }

/* ---- よしゅう */
.preview { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; }
.pv-pad { display: grid; gap: 10px; }
.pv-pad .strokes { color: var(--ink-sub); }
.pv-info { display: grid; gap: 14px; align-content: start; }
.words { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.words li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; }
.pw { font-size: 44px; font-family: var(--font-kanji); }
.pw b { font-weight: 400; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
.pk { font-size: 24px; letter-spacing: .1em; }
.say { min-width: var(--tap); min-height: var(--tap); font-size: 26px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; }
.pv-guide { margin: 0; font-size: 22px; font-weight: 700; }

/* ---- おわり */
.done { display: grid; gap: 18px; justify-items: center; text-align: center; padding-top: 10vh; max-width: 560px; margin: 0 auto; }
.done-big { font-size: 40px; font-weight: 700; margin: 0; }

/* ---- 先生用 */
.top.t { flex-wrap: wrap; }
.try { margin-left: auto; min-height: 52px; padding: 0 18px; font-size: 18px; background: var(--card); border: 2px solid var(--cat-1); color: var(--ink-link); border-radius: 12px; }
#trial-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 16px; background: var(--fill-b); border-bottom: 2px solid var(--cat-3); font-size: 16px; }
#trial-bar .tb-label { font-weight: 700; margin-right: auto; }
#trial-bar button { min-height: 44px; padding: 0 14px; font-size: 16px; background: var(--card); border: 2px solid var(--ink); border-radius: 10px; }
.top.t h1 { font-size: 26px; }
.teacher section { margin: 14px 0 22px; }
.teacher h2 { font-size: 22px; margin: 0 0 6px; }
.teacher .hint { color: var(--ink-sub); font-size: 16px; margin: 0 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; }
.cell { min-height: 46px; font-size: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.cell.taught { background: var(--fill-a); border: 2px solid var(--cat-1); font-weight: 700; }
.hard { columns: 2; font-size: 18px; }
.hard .hc { font-size: 26px; margin-right: 8px; }
.teacher textarea { width: 100%; font-size: 20px; }
.teacher details { font-size: 18px; }
.teacher details button { min-height: 48px; padding: 0 16px; }
/* 先生画面の設定: 開閉式。見出し全体が押せる（高さ56px）、右に いまの値 */
.tset { border: 2px solid var(--line); border-radius: 14px; background: var(--card); margin: 10px 0; }
.tset > summary { list-style: none; cursor: pointer; min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 19px; }
.tset > summary::-webkit-details-marker { display: none; }
.tset > summary::before { content: ''; width: 0; height: 0; border-left: 9px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; transition: transform .15s; }
.tset[open] > summary::before { transform: rotate(90deg); }
.tset .ts-now { margin-left: auto; font-weight: 400; color: var(--ink-sub); font-size: 17px; text-align: right; }
.tset .ts-body { padding: 0 16px 12px; border-top: 1px solid var(--line); }

/* ---- 縦長（タブレット持ち）・狭い画面 */
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  .menu, .write, .preview { grid-template-columns: 1fr; }
  .padbox, .pv-pad .padbox { width: min(calc(100vw - 32px), 52vh); }
  .card { min-height: 38vh; }
  .tree { max-height: 42vh; }
}

/* ---- 書き順の提示（モニター用） */
.picked { font-size: 24px; min-height: 1.6em; display: flex; gap: 14px; flex-wrap: wrap; }
.pk-item b { font-size: 34px; }
.teacher .grid .cell[disabled] { opacity: .35; }
#stage { position: fixed; inset: 0; background: #fff; z-index: 50; cursor: pointer; user-select: none; }
#stage.single { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
#stage .big-kanji { height: 100vh; aspect-ratio: 1; max-width: 78vw; display: flex; align-items: center; justify-content: center; }
#stage .show-svg { width: 100%; height: 100%; display: block; }
#stage .show-svg .frame { fill: none; stroke: #9AA0A6; stroke-width: .9; }
#stage .show-svg .cross { stroke: #9AA0A6; stroke-width: .7; stroke-dasharray: 2.2 2.2; }
#stage .show-svg .base path { stroke: #D3D7DC; } /* うすい完成形（下地） */
/* 一〜四画目の色分け（線用の4色。黒・下地・白地と見分けられることを検査済み。色だけに頼らず番号を併記） */
:root { --stroke-1: #0F5EA8; --stroke-2: #C86A00; --stroke-3: #6E4310; --stroke-4: #00806B; }
#stage .show-svg .ink path.s1 { stroke: var(--stroke-1); }
#stage .show-svg .ink path.s2 { stroke: var(--stroke-2); }
#stage .show-svg .ink path.s3 { stroke: var(--stroke-3); }
#stage .show-svg .ink path.s4 { stroke: var(--stroke-4); }
#stage .show-svg .nums text { font-family: var(--font-sans); font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #fff; stroke-width: 2.4px; stroke-linejoin: round; }
#stage .show-svg .nums .n1, .cswatch.s1 { fill: var(--stroke-1); color: var(--stroke-1); }
#stage .show-svg .nums .n2, .cswatch.s2 { fill: var(--stroke-2); color: #A85800; }
#stage .show-svg .nums .n3, .cswatch.s3 { fill: var(--stroke-3); color: var(--stroke-3); }
#stage .show-svg .nums .n4, .cswatch.s4 { fill: var(--stroke-4); color: var(--stroke-4); }
.cswatch { font-weight: 700; margin: 0 .25em; border-bottom: 4px solid currentColor; }
.cswatch.s2 { border-bottom-color: var(--stroke-2); }
.opt { font-size: 20px; display: inline-flex; gap: 10px; align-items: center; }
.opt input { width: 26px; height: 26px; }
#stage .show-svg path { fill: none; stroke: #111; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
/* 読み: 1文字ずつ縦に積み、読みが複数なら右から左へ列をならべる（教科書の縦書きと同じ並び） */
#stage .kun, #stage .on { display: flex; flex-direction: row-reverse; gap: .35em; align-items: center; justify-content: center; height: 94vh; }
#stage .rd { display: flex; flex-direction: column; align-items: center; font-weight: 700; }
#stage .rd .ch { display: block; line-height: 1.12; }
#stage .rd .ch.small { transform: translate(.16em, -.16em) scale(.9); } /* 縦書きの小書き仮名は右上に寄せる */
#stage .rd .ch.long { transform: rotate(90deg); }
#stage .rd .ch.okuri { color: var(--ink-link); } /* 送り仮名: 大きさはそのまま、青、太字 */
/* 語幹と送り仮名の区切り: 短い縦棒（色だけに頼らない） */
#stage .rd .sep { display: block; width: .12em; height: .45em; margin: .12em 0; background: var(--ink-link); border-radius: .06em; }
#stage .stage-pos { position: absolute; bottom: 8px; left: 12px; color: var(--ink-sub); font-size: 18px; }
#stage.all { display: flex; align-items: center; justify-content: center; }
#stage .all-grid { display: grid; justify-content: center; align-content: center; }
.stage-full { position: fixed; top: 8px; right: 66px; z-index: 51; height: 48px; padding: 0 16px; font-size: 18px; border: 1px solid var(--line); background: #fff; border-radius: 24px; color: var(--ink-sub); opacity: .75; }
.stage-full[hidden] { display: none; }
.stage-exit { position: fixed; top: 8px; right: 10px; z-index: 51; width: 48px; height: 48px; font-size: 26px; border: 1px solid var(--line); background: #fff; border-radius: 50%; color: var(--ink-sub); opacity: .6; }

/* ================= 学年タブ・一覧・見る・問題の始め方・カード・おわり（全学年版） */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tabs .tab, .tabs .ttab, .tabs .ptab { min-height: 52px; min-width: 76px; padding: 0 14px; font-size: 22px; font-weight: 700; background: var(--card); border: 2px solid var(--line); border-radius: 12px 12px 0 0; color: var(--ink-sub); }
.tabs [aria-selected="true"] { border-color: var(--ink); color: var(--ink); background: var(--fill-a); box-shadow: inset 0 -4px 0 var(--cat-1); }
.tabs.t { margin: 6px 0 10px; }
.big[disabled] { opacity: .45; cursor: default; }
.menu .actions .big { min-height: 88px; font-size: 26px; }

.browse-tools { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 4px 0 6px; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; }
.seg button { min-height: 60px; min-width: 130px; font-size: 24px; font-weight: 700; background: var(--card); border: 0; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--solid-on); color: #fff; }
.sel-count { font-size: 20px; font-weight: 700; }
.browse-tools .clear { min-height: 48px; padding: 0 14px; font-size: 16px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; }
.browse-hint { margin: 0 0 8px; color: var(--ink-sub); font-size: 18px; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.kc { position: relative; min-height: 64px; font-size: 34px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; font-family: var(--font-kanji); }
.kc.sel { background: var(--fill-b); border: 3px solid var(--cat-3); }
.kc.sel::after { content: "✓"; position: absolute; top: 1px; right: 5px; font-size: 16px; font-family: var(--font-sans); font-weight: 700; color: var(--cat-3); }

.bar .nav { display: flex; gap: 8px; }
.view { display: grid; grid-template-columns: minmax(260px, 1fr) auto; gap: 18px; align-items: start; }
.vwords h2 { font-size: 22px; margin: 0 0 8px; }
.vwords ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.vwords li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; }
.vw { font-size: 42px; font-family: var(--font-kanji); }
.vw .tg { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
.vk { font-size: 24px; letter-spacing: .1em; }
.vmeta { color: var(--ink-sub); }
.pick-one { min-height: 60px; padding: 0 20px; font-size: 20px; font-weight: 700; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; }
.pick-one[aria-pressed="true"] { background: var(--fill-b); border-color: var(--cat-3); }
.monitor { display: flex; align-items: center; gap: 1vw; background: #fff; border-radius: 14px; padding: 6px; }
.monitor .mon-kanji .show-svg, #stage .show-svg { width: 100%; height: 100%; display: block; }
.monitor .show-svg .frame, #stage .show-svg .frame { fill: none; stroke: #9AA0A6; stroke-width: .9; }
.monitor .show-svg .cross, #stage .show-svg .cross { stroke: #9AA0A6; stroke-width: .7; stroke-dasharray: 2.2 2.2; }
.monitor .show-svg path { fill: none; stroke: #111; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
.monitor .show-svg .base path { stroke: #D3D7DC; }
.monitor .kun, .monitor .on { display: flex; flex-direction: row-reverse; gap: .35em; align-items: center; justify-content: center; }
.monitor .rd { display: flex; flex-direction: column; align-items: center; font-weight: 700; }
.monitor .rd .ch { display: block; line-height: 1.12; }
.monitor .rd .ch.small { transform: translate(.16em, -.16em) scale(.9); }
.monitor .rd .ch.long { transform: rotate(90deg); }
.monitor .rd .ch.okuri { color: var(--ink-link); }
.monitor .rd .sep { display: block; width: .12em; height: .45em; margin: .12em 0; background: var(--ink-link); border-radius: .06em; }

.chooser { display: grid; gap: 14px; max-width: 720px; margin: 0 auto; }
.chooser h2 { margin: 4px 0; font-size: 26px; text-align: center; }

.okuri-after { align-self: center; font-size: 40px; font-weight: 700; color: var(--ink-link); padding: 0 4px; }
.answer-row { grid-template-columns: 1fr auto auto; }

.flash { height: calc(100vh - 100px); display: flex; cursor: pointer; user-select: none; }
.fcard { flex: 1; display: grid; grid-template-rows: minmax(0, 2fr) minmax(0, 3fr) auto; justify-items: center; background: var(--card); border: 3px solid var(--ink); border-radius: 22px; overflow: hidden; }
/* よみ（上）・漢字（下）の2段は大きさが固定。答えの段は はじめ visibility で隠すだけなので、答えが出ても字が上下に動かない */
.fcard .frow { width: 100%; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 0; }
.fcard .fk-row { border-top: 3px dashed var(--line); }
.fcard:not(.flipped) .ans > * { visibility: hidden; }
.fcard .word { font-family: var(--font-kanji); line-height: 1.05; white-space: nowrap; }
.fcard .tg { font-size: clamp(110px, 30vmin, 300px); }
.fcard .ot { font-size: clamp(64px, 17vmin, 170px); }
.fcard .fy { font-size: clamp(56px, 12vmin, 140px); letter-spacing: .12em; font-weight: 700; white-space: nowrap; }
.ftap { margin: 0; color: var(--ink-sub); font-size: 20px; }

.done.wide { max-width: 900px; padding-top: 4vh; }
.endlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; width: 100%; }
.endlist label { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 6px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.endlist input { width: 28px; height: 28px; }
.endlist .ec { font-size: 40px; font-family: var(--font-kanji); }
.endlist .er { font-size: 18px; font-weight: 700; }
.endlist .er.good { color: var(--cat-1); }
.endlist .er.again { color: var(--ink-alert); }
.gchecks { display: flex; gap: 18px; flex-wrap: wrap; }
.teacher h3 { font-size: 20px; margin: 14px 0 6px; }

@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  .view { grid-template-columns: 1fr; }
  .monitor { order: -1; justify-content: center; }
}
.tools[hidden] { display: none; }

/* 先生: 子どもごとの記録 */
.kids-wrap { overflow-x: auto; }
.kids { border-collapse: collapse; width: 100%; font-size: 17px; background: var(--card); }
.kids th, .kids td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; white-space: nowrap; }
.kids th { background: var(--fill-a); font-weight: 700; }
.kids tr.idle td { background: var(--fill-b); }
.kids .kmiss { font-size: 22px; letter-spacing: .2em; font-family: var(--font-kanji); }

/* タイトル「漢字の森」: 森の3つの木を別の色に（飾り。識別には使わない） */
.title { display: inline-flex; align-items: center; gap: .05em; }
.title .mori { width: 1.12em; height: 1.16em; margin: 0 .04em; overflow: visible; position: relative; top: -.07em; }
.title .mori path { fill: none; stroke-width: 8.5; stroke-linecap: round; stroke-linejoin: round; }
.title .mori .tree1 path { stroke: #5A9E1E; } /* 若葉 */
.title .mori .tree2 path { stroke: #1F6B3A; } /* 深緑 */
.title .mori .tree3 path { stroke: #B5541B; } /* 紅葉 */
.title .title-extra { margin-left: .4em; }

/* 先生: 次の漢字テストの範囲 */
.tcell { position: relative; min-height: 46px; font-size: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.tcell.tsel { background: var(--fill-b); border: 2px solid var(--cat-3); font-weight: 700; }
.tcell.tsel::after { content: "✓"; position: absolute; top: 0; right: 3px; font-size: 12px; color: var(--cat-3); }
.teacher input#test-label { font-size: 18px; min-height: 44px; padding: 0 10px; width: min(100%, 360px); }
.picked .tlist { font-size: 26px; letter-spacing: .15em; font-family: var(--font-kanji); }
</style>

  var INTERVALS = [1, 1, 2, 4, 7, 15];

  var MAX_BOX = 5;

  // 端末の現地日付を 2020-01-01 からの日数に
  function day(date) {

  }

      anims.push(p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, delay: t, fill: 'forwards', easing: 'linear' }));
      t += dur + 120;

    return Promise.all(anims.map(function (a) { return a.finished; })).catch(function () {});
  }

  // 書字パッド
  // opts: { strokes: [d...], mode: 'trace'|'hint'|'free'|'show', onDone(result), onMiss(kind), onStroke(i) }
  function Pad(container, opts) {
    var self = this;
    this.opts = opts;
    container.innerHTML = '';
    var svg = el('svg', { viewBox: '0 0 109 109', class: 'pad', role: 'img', 'aria-label': 'かくところ' }, container);
    el('rect', { x: 1, y: 1, width: 107, height: 107, class: 'pad-frame' }, svg);
    el('path', { d: 'M54.5 4V105M4 54.5H105', class: 'pad-grid' }, svg);
    this.svg = svg;
    this.guide = el('g', { class: 'pad-guide' }, svg);
    this.ink = el('g', { class: 'pad-ink' }, svg);
    this.marks = el('g', { class: 'pad-marks' }, svg);
    this.tplPaths = opts.strokes.map(function (d) { return el('path', { d: d }, self.guide); });
    this.tpl = this.tplPaths.map(function (p) {
      var L = p.getTotalLength(), pts = [];
      for (var i = 0; i < N; i++) { var q = p.getPointAtLength(L * i / (N - 1)); pts.push({ x: q.x, y: q.y }); }
      return { pts: pts, len: L, c: centroid(pts) };

    this.penSeen = false;
    this.bind();
    this.setMode(opts.mode || 'free');
  }

  Pad.prototype.reset = function () {
    this.done = this.tpl.map(function () { return false; });
    this.next = 0; // 次に期待する画
    this.shifts = [];
    this.result = { orderMiss: 0, misses: 0, assisted: false };
    this.streak = 0; // 同じ画で続けて外れた回数
    this.hintOn = false;
    this.stuck = false;
    this.ink.innerHTML = '';
    this.renderGuide();
  };

  Pad.prototype.setMode = function (m) {
    this.mode = m;
    this.reset();
  };

  Pad.prototype.offset = function () {
    if (!this.shifts.length) return { x: 0, y: 0 };
    var s = centroid(this.shifts);
    return { x: Math.max(-MAX_SHIFT, Math.min(MAX_SHIFT, s.x)), y: Math.max(-MAX_SHIFT, Math.min(MAX_SHIFT, s.y)) };
  };

  Pad.prototype.expected = function () {
    for (var i = 0; i < this.done.length; i++) if (!this.done[i]) return i;
    return -1;
  };

  // ガイド: なぞる＝全画を薄く、ヒント＝次の1画だけ、じぶんで＝なし（外れが続いたら次の1画を出す）
  Pad.prototype.renderGuide = function () {
    var m = this.mode, nx = this.expected(), hint = this.hintOn;
    this.tplPaths.forEach(function (p, i) {
      var show = m === 'show' || (m === 'trace' && !this.done[i]) || ((m === 'hint' || hint) && i === nx);
      p.setAttribute('class', show ? (i === nx && m !== 'show' ? 'g-next' : 'g-all') : 'g-hide');
      p.style.strokeDasharray = ''; p.style.strokeDashoffset = '';
    }, this);
    this.marks.innerHTML = '';
    if (nx >= 0 && (m === 'trace' || m === 'hint' || hint)) {
      var s = this.tpl[nx].pts[0];

    }
  };

  Pad.prototype.bind = function () {
    var self = this, cur = null, pid = null;
    function pt(ev) {
      var r = self.svg.getBoundingClientRect();
      return { x: (ev.clientX - r.left) / r.width * 109, y: (ev.clientY - r.top) / r.height * 109 };
    }
    this.svg.addEventListener('pointerdown', function (ev) {
      if (self.mode === 'show' || self.stuck || self.expected() < 0) return;
      if (ev.pointerType === 'pen') self.penSeen = true;
      if (self.penSeen && ev.pointerType === 'touch') return; // ペンを使っている間は手のひらの接触を無視
      if (pid !== null) return;

      self.svg.setPointerCapture(pid);

      if (ev.pointerId !== pid || !cur) return;
      var p = pt(ev), last = cur.pts[cur.pts.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) < 0.8) return;
      cur.pts.push(p);
      cur.line.setAttribute('points', cur.pts.map(function (q) { return q.x.toFixed(1) + ',' + q.y.toFixed(1); }).join(' '));
    });
    function end(ev) {
      if (ev.pointerId !== pid || !cur) return;
      pid = null;
      var c = cur; cur = null;
      self.judge(c);

    this.svg.addEventListener('pointerup', end);
    this.svg.addEventListener('pointercancel', end);

  Pad.prototype.judge = function (c) {
    var drawn = resample(c.pts), dlen = polyLen(c.pts), off = this.offset();
    var nx = this.expected(), best = -1, bestS = Infinity, reversed = false;
    var fit = function (i) {
      var t = this.tpl[i];
      var f = meanDist(drawn, t.pts, off, false), r = meanDist(drawn, t.pts, off, true);
      var shortTpl = t.len < 22; // 点などの短い画は向きを問わない
      var lenOk = shortTpl || (dlen > t.len * 0.35 && dlen < t.len * 2.3 + 15);
      return { s: shortTpl ? Math.min(f, r) : f, rev: !shortTpl && r < f * 0.7 && r <= TOL, ok: lenOk };
    }.bind(this);
    var e = fit(nx);
    if (e.ok && e.s <= TOL) { best = nx; bestS = e.s; }
    else {
      for (var i = 0; i < this.tpl.length; i++) {
        if (this.done[i] || i === nx) continue;
        var f = fit(i);
        if (f.ok && f.s <= TOL && f.s < bestS) { best = i; bestS = f.s; }
      }
      if (best < 0 && e.rev) reversed = true;
    }
    if (best < 0) {
      c.line.setAttribute('class', 'stroke-miss');
      setTimeout(function () { if (c.line.parentNode) c.line.parentNode.removeChild(c.line); }, 450);
      this.result.misses++;
      this.streak++;
      if (this.mode === 'free' && this.streak >= 2 && !this.hintOn) {
        this.result.assisted = true;
        // onStuck があれば、ヒントを出さずに知らせる（呼び出し側が正解の書き順を見せて次へ進む）
        if (this.opts.onStuck) { this.stuck = true; this.opts.onStuck(this.result); return; }
        this.hintOn = true;
        this.renderGuide();
      }
      if (this.opts.onMiss) this.opts.onMiss(reversed ? 'reverse' : 'shape');
      return;
    }
    this.streak = 0;
    if (best !== nx) this.result.orderMiss++;
    this.done[best] = true;
    var dc = centroid(drawn), tc = this.tpl[best].c;
    this.shifts.push({ x: dc.x - tc.x, y: dc.y - tc.y });
    c.line.setAttribute('class', 'stroke-ok');
    this.renderGuide();
    if (this.opts.onStroke) this.opts.onStroke(best);
    if (this.expected() < 0 && this.opts.onDone) this.opts.onDone(this.result);
  };

  // お手本を再生（書いた線は消す）
  Pad.prototype.demo = function (speed) {
    var prev = this.mode;
    this.mode = 'show';
    this.ink.innerHTML = '';
    this.marks.innerHTML = '';
    this.tplPaths.forEach(function (p) { p.setAttribute('class', 'g-demo'); });
    var self = this;
    return animate(this.tplPaths, speed).then(function () {
      self.tplPaths.forEach(function (p) { p.getAnimations().forEach(function (a) { a.cancel(); }); });
      self.mode = prev;
      self.reset();
    });
  };

  root.Ink = { Pad: Pad, animate: animate, _resample: resample };
})(this);
</script>
<script>
// メニューの「育つ木」。本人の取り組みだけで育つ（他の児童のデータは使わない：設計書 §1）。
// はっぱ＝最後まで終えた回の問題数（よむ・かく・カード。途中でやめた回は数えない。正誤は問わない）、み＝おぼえた字。
// 軽さのため: 要素は最大約450個、描画はメニューを開いた時の1回だけ。常時動くアニメーションは置かない。
(function (root) {
  'use strict';
  var MAX_LEAVES = 240;
  var FULL = 1500; // この取り組み数で木が最大になる
  var GA = 2.399963; // 黄金角（葉が重ならず、増えても前の葉の位置が変わらない）

  function f1(n) { return Math.round(n * 10) / 10; }
  // 位置の揺らぎ（番号から決まるので、増えても前の葉・実は動かない）
  function jit(i, k) { var x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x) - 0.5; }

  // prevActivity: 前回メニューを開いた時の数。増えた分の葉を「新しい葉」として一度だけ弾ませる
  function render(activity, learned, total, prevActivity) {
    var g = Math.min(1, Math.log(1 + activity) / Math.log(1 + FULL));
    var groundY = 228, trunkH = 26 + 104 * g, trunkW = 5 + 11 * g;
    var cx = 160, cy = groundY - trunkH - 18 * g;
    var rx = 16 + 104 * g, ry = 13 + 72 * g;
    var s = [];
    s.push('<svg viewBox="0 0 320 240" class="tree" role="img" aria-label="とりくんだ数 ' + activity + '、おぼえた字 ' + learned + '">');
    s.push('<ellipse cx="160" cy="' + (groundY + 4) + '" rx="150" ry="12" class="t-ground"/>');
    // 幹と枝
    s.push('<path class="t-trunk" d="M' + f1(cx - trunkW) + ' ' + groundY + ' Q' + f1(cx - trunkW * 0.4) + ' ' + f1(groundY - trunkH * 0.5) + ' ' + f1(cx - trunkW * 0.3) + ' ' + f1(cy) +
      ' L' + f1(cx + trunkW * 0.3) + ' ' + f1(cy) + ' Q' + f1(cx + trunkW * 0.4) + ' ' + f1(groundY - trunkH * 0.5) + ' ' + f1(cx + trunkW) + ' ' + groundY + 'Z"/>');
    if (g > 0.45) {
      var by = cy + ry * 0.35;
      s.push('<path class="t-branch" stroke-width="' + f1(trunkW * 0.45) + '" d="M' + cx + ' ' + f1(by + 10) + ' Q' + f1(cx - rx * 0.3) + ' ' + f1(by) + ' ' + f1(cx - rx * 0.55) + ' ' + f1(by - ry * 0.35) +
        'M' + cx + ' ' + f1(by + 4) + ' Q' + f1(cx + rx * 0.3) + ' ' + f1(by - 6) + ' ' + f1(cx + rx * 0.55) + ' ' + f1(by - ry * 0.45) + '"/>');
    }
    // はっぱ
    var nLeaves = Math.min(activity, MAX_LEAVES), prev = Math.min(prevActivity == null ? activity : prevActivity, MAX_LEAVES);
    for (var i = 0; i < nLeaves; i++) {
      var r = Math.sqrt((i + 0.6) / MAX_LEAVES), a = i * GA;
      var x = cx + Math.cos(a) * r * rx + jit(i, 1) * 9, y = cy + Math.sin(a) * r * ry + jit(i, 2) * 7;
      var rot = Math.round((a * 57.3) % 360);
      var shade = i % 3;
      s.push('<ellipse class="t-leaf l' + shade + (i >= prev ? ' t-new' : '') + '" cx="' + f1(x) + '" cy="' + f1(y) + '" rx="5.2" ry="2.8" transform="rotate(' + rot + ' ' + f1(x) + ' ' + f1(y) + ')"' +
        (i >= prev ? ' style="animation-delay:' + Math.min(i - prev, 20) * 40 + 'ms"' : '') + '/>');
    }
    if (activity === 0) s.push('<path class="t-sprout" d="M160 228 q-2 -12 -12 -16 q10 0 12 10 q2 -10 12 -10 q-10 4 -12 16z"/>');
    // み（おぼえた字）
    var nFruit = Math.min(learned, total);
    for (var j = 0; j < nFruit; j++) {
      var r2 = Math.sqrt((j + 0.5) / total) * 0.9, a2 = j * 2.62 + 1.2 + jit(j, 3) * 0.6;
      var fx = cx + Math.cos(a2) * r2 * rx + jit(j, 4) * 8, fy = cy + Math.sin(a2) * r2 * ry + jit(j, 5) * 6;
      s.push('<circle class="t-fruit" cx="' + f1(fx) + '" cy="' + f1(fy) + '" r="3"/>');
    }
    s.push('</svg>');
    return s.join('');
  }

  root.Tree = { render: render };
})(this);
</script>
<script>
// 画面（設計書 §4・§5）。
// 児童: メニュー（学年タブ・木）→ 漢字を ぜんぶ見る（見る／選ぶ）／よむ／かく／カード／えらんだ漢字を見る
// 先生: 見せる学年・進度・つまずき集計、書き順の提示、児童画面のおためし
(function () {
  'use strict';
  var D = KANZI_DATA, ST = KANZI_STROKES;
  var app = document.getElementById('app');
  // 日本語の字形を使わせる（中国語フォント・中国語の字形を出さない）。GAS の埋め込みでも確実にするため JS でも付ける
  document.documentElement.lang = 'ja'; document.body.lang = 'ja';
  var S = { info: null, p: null, grades: [3], grade: 3, pointers: {}, orders: {}, sinceFlush: 0, session: null, open: {} };
  var FLUSH_EVERY = 10;

  var SEL_MAX = 30;

  function $(sel) { return app.querySelector(sel); }
  function on(sel, fn) { var e = $(sel); if (e) e.addEventListener('click', fn); }
  // 先生のおためしでは「1日すすめる」で日付をずらせる（S.dayOffset）。本番の児童は常に0
  function nowMs() { return Date.now() + (S.dayOffset || 0) * 86400000; }
  function today() { return Sched.day(new Date(nowMs())); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  var canSpeak = 'speechSynthesis' in window;
  function speak(t) {
    if (!canSpeak) return;
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {}
  }

  // 学年ごとの出題順（先生が貼り付けた順があればそれ、なければ配当表の順）
  function orderOf(g) { return S.orders[g] || D.grades[g].order; }
  function maxGrade() { return Math.max.apply(null, S.grades); }
  // 習った漢字: 下の学年は全部。いちばん上の学年は先生の進度まで（進度を設定していなければ全部）
  function learnedChars(g) {
    var o = orderOf(g), ptr = S.pointers[g];
    return (g < maxGrade() || !ptr) ? o.split('') : o.slice(0, ptr).split('');
  }
  // 児童向けの文言: [漢|よみ] と書いた漢字は、その子の学年（見せる学年のいちばん上）までに習う字なら漢字、
  // まだ習わない字なら よみ（ひらがな）で出す。学年別漢字配当表どおりの交ぜ書き（例: 1・2年「かん字」、3年から「漢字」）
  function K(str) {
    var g = maxGrade();
    return String(str).replace(/\[([^|\]]+)\|([^\]]+)\]/g, function (_, k, r) { var i = D.kanji[k]; return i && i.g <= g ? k : r; });
  }
  // 次の漢字テストの範囲（先生が指定した字。学年をまたいでよい）
  function testChars() { return S.test && S.test.chars ? Array.from(S.test.chars).filter(function (c) { return D.kanji[c]; }) : []; }

  function wordFor(c, n) { var w = D.kanji[c].w; return w[(n || 0) % w.length]; }
  function wordHtml(w, c) { return Array.from(w[0]).map(function (ch) { return '<span class="' + (ch === c ? 'tg' : 'ot') + '">' + esc(ch) + '</span>'; }).join(''); }

    return Platform.flush(function () { return S.p; }).then(function (m) { if (S.p && !!S.trial === trial && m) S.p = m; });

  // 画面を切り替えるたびに、動いている書き順アニメ・キー操作を止める
  var cleanup = [];

  // タイトル「漢字の森」。森は筆順データの線で描き、3つの木（1〜4画・5〜8画・9〜12画）を別の色にする（色は飾り）
  function titleHtml(extra) {

      K('<div class="two"><button class="big primary" id="go-read">[読|よ]む<span class="meta">[漢|かん][字|じ] → [読|よ]みを [書|か]く</span></button>') +
      K('<button class="big primary" id="go-write">[書|か]く<span class="meta">[読|よ]み → [漢|かん][字|じ]を [書|か]く</span></button></div>') +
      K('<div class="two"><button class="big" id="go-fk">カード<span class="meta">[漢|かん][字|じ] → [読|よ]み</span></button>') +
      K('<button class="big" id="go-fy">カード<span class="meta">[読|よ]み → [漢|かん][字|じ]</span></button></div>') +
      (testChars().length ? '<button class="big test" id="go-test">' + K('[次|つぎ]の[漢|かん][字|じ]テストの はんいを [見|み]る') + '<span class="meta">' + (S.test.label ? esc(S.test.label) + '・' : '') + testChars().length + K('[字|じ]') + '</span></button>' : '') +
      '<button class="big" id="go-seen"' + (nSel ? '' : ' disabled') + '>' + K('[選|えら]んだ[漢|かん][字|じ]を[見|み]る') + '<span class="meta">' + (nSel ? nSel + K('[字|じ]') : K('まだ [選|えら]んでいないよ')) + '</span></button>' +
      '</section></main>' + (S.info.demo && !S.trial ? '<p class="demo-note">デモ（この端末にだけ保存）</p>' : '');

  // ================= 児童: 漢字を ぜんぶ見る（見る／えらぶ）

    app.innerHTML =
      '<header class="bar"><button class="back" id="back">もどる</button><span class="prog">' + g + K('年の[漢|かん][字|じ]（') + order.length + K('[字|じ]）') + '</span><span></span></header>' +
      '<div class="browse-tools"><div class="seg" role="group" aria-label="おしたときの うごき">' +
      '<button id="m-look" aria-pressed="' + (mode === 'look') + '">👀 ' + K('[見|み]る') + '</button><button id="m-pick" aria-pressed="' + (mode === 'pick') + '">✓ ' + K('[選|えら]ぶ') + '</button></div>' +
      '<span class="sel-count" id="selc"></span>' +
      (mode === 'pick' ? K('<button class="clear" id="clear">[選|えら]んだ[字|じ]を ぜんぶ はずす</button>') : '') + '</div>' +
      '<p class="browse-hint">' + (mode === 'look' ? K('[字|じ]を おすと、[書|か]き[順|じゅん]と [言|こと][葉|ば]が [見|み]られるよ') : K('[字|じ]を おすと、[問|もん][題|だい]に [出|だ]す[字|じ]に [選|えら]べるよ（もう[一|いち][度|ど] おすと はずれる）')) + '</p>' +
      '<div class="kgrid" id="kgrid">' + order.map(function (c) { return '<button class="kc" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>';
    function paint() {
      var n = 0;
      app.querySelectorAll('.kc').forEach(function (b) {
        var s = Sched.isSel(S.p, b.dataset.c); if (s) n++;
        b.classList.toggle('sel', s);
        b.setAttribute('aria-pressed', s);
      });
      $('#selc').textContent = K('[選|えら]んだ[字|じ] ') + n;
    }
    on('#back', menu);
    on('#m-look', function () { browse('look'); });
    on('#m-pick', function () { browse('pick'); });
    on('#clear', function () { order.forEach(function (c) { if (Sched.isSel(S.p, c)) Sched.setSel(S.p, c, false, nowMs()); }); commit(); paint(); });
    app.querySelectorAll('.kc').forEach(function (b, i) {
      b.addEventListener('click', function () {
        if (mode === 'look') return viewChars(order, i, function () { browse('look'); });
        Sched.setSel(S.p, b.dataset.c, !Sched.isSel(S.p, b.dataset.c), nowMs());
        commit();
        paint();
      });

    paint();
  }

  // ================= 字の表示（先生のモニター表示と同じ形: 外枠・十字・うす文字の上を黒で書き順、左右に読み）
  var SHOW_OPTS_KEY = 'kanzi.showOpts';
  function showOpts() { var o = Platform.store.get(SHOW_OPTS_KEY) || {}; return { base: o.base !== false, color: !!o.color }; }
  function setShowOpt(k, v) { var o = showOpts(); o[k] = v; Platform.store.set(SHOW_OPTS_KEY, o); }
  // 一〜四画目の色分け（先生の提示）。色だけに頼らないよう、各画の書きはじめに画の番号（1〜4）を同じ色で置く。
  // 色は線用の4色（青・橙・茶・緑）。黒（5画目から）・うすい下地・白地と、どの色覚の型でも見分けられることを検査済み（docs/design.md §17）
  var COLOR_STROKES = 4;
  // 番号の置き場所は描いた後に決める（placeNums）。ここでは番号だけ出す
  function strokeNums(c) {
    return '<g class="nums" aria-hidden="true">' + ST[c].slice(0, COLOR_STROKES).map(function (d, i) {
      return '<text class="n' + (i + 1) + '" x="-20" y="-20">' + (i + 1) + '</text>';
    }).join('') + '</g>';
  }
  // 番号を、その画の書きはじめのまわり（半径7・9.5・12の24方向）のうち、どの画の線からも・先に置いた番号からも
  // いちばん離れた所に置く。同じ点から始まる画（円の1と2など）や、ほかの画の上に番号が重ならないように。
  // 同じくらいなら、書きはじめの手前（書く向きの反対側）を選ぶ
  function placeNums(root) {
    Array.from(root.querySelectorAll('svg.colored')).forEach(function (svg) {
      var paths = Array.from(svg.querySelectorAll('.ink path')), texts = Array.from(svg.querySelectorAll('.nums text')), pts = [], placed = [];
      paths.forEach(function (p) { var L = p.getTotalLength(); for (var t = 0; t <= L; t += 2) { var q = p.getPointAtLength(t); pts.push([q.x, q.y]); } });
      function near(x, y, list) { var m = 99; for (var i = 0; i < list.length; i++) { var dx = list[i][0] - x, dy = list[i][1] - y, d = Math.sqrt(dx * dx + dy * dy); if (d < m) m = d; } return m; }
      texts.forEach(function (tx, i) {
        var p = paths[i], a = p.getPointAtLength(0), b = p.getPointAtLength(Math.min(4, p.getTotalLength())), best = null;
        var bx = a.x - b.x, by = a.y - b.y, bn = Math.sqrt(bx * bx + by * by) || 1;
        [7, 9.5, 12].forEach(function (r) {
          for (var k = 0; k < 24; k++) {
            var ang = k * Math.PI / 12, ux = Math.cos(ang), uy = Math.sin(ang), x = a.x + ux * r, y = a.y + uy * r;
            if (x < 5 || x > 104 || y < 5 || y > 104) continue;
            // 線から 6.5 以上（字の半分＋線の太さの半分）離れていれば十分。それより近いほど大きく減点
            var dl = near(x, y, pts), dp = near(x, y, placed);
            var score = Math.min(dl, 9) + (dl < 6.5 ? (dl - 6.5) * 2 : 0) + Math.min(dp, 9) * 0.6 + 1.2 * (ux * bx + uy * by) / bn - (r - 7) * 0.35;
            if (!best || score > best.s) best = { s: score, x: x, y: y };
          }
        });
        if (!best) best = { x: Math.max(5, Math.min(104, a.x)), y: Math.max(5, Math.min(104, a.y)) };

      });
    });
  }
  // color: 一〜四画目を色分けし、書きはじめに番号を置く（先生の提示だけ）
  function kanjiSvg(c, cls, base, color) {
    // 十字の点線（字全体のバランスの目安）。線は <line> にして、書き順アニメ（path が対象）に巻き込まない
    return '<svg viewBox="0 0 109 109" class="' + cls + (color ? ' colored' : '') + '"><rect class="frame" x="0.8" y="0.8" width="107.4" height="107.4"/><line class="cross" x1="54.5" y1="1" x2="54.5" y2="108"/><line class="cross" x1="1" y1="54.5" x2="108" y2="54.5"/>' +
      (base ? '<g class="base">' + ST[c].map(function (d) { return '<path d="' + d + '"/>'; }).join('') + '</g>' : '') +
      '<g class="ink">' + ST[c].map(function (d, i) { return '<path' + (color && i < COLOR_STROKES ? ' class="s' + (i + 1) + '"' : '') + ' d="' + d + '"/>'; }).join('') + '</g>' +
      (color ? strokeNums(c) : '') + '</svg>';
  }
  // 読みがなの大きさ: 字の高さ H の14%を基本とし、長い読み・複数の読みが左右の幅 side に収まらない時だけ縮める
  function readSize(list, H, side) {
    var len = Math.max.apply(null, list.map(function (r) { return r.replace('.', '').length + (r.indexOf('.') >= 0 ? 0.7 : 0); }).concat([1]));
    return Math.floor(Math.min(H * 0.14, H * 0.88 / (len * 1.15), side * 0.9 / (list.length * 1.25 || 1))) + 'px';
  }
  // 読みを1文字ずつ縦に積む（CSS の縦書きより位置が安定し、区切りの縦棒を字の間に確実に置ける）
  var SMALL_KANA = 'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ';
  function stackChars(str, cls) {
    return Array.from(str).map(function (ch) {
      var c = 'ch' + (cls ? ' ' + cls : '') + (SMALL_KANA.indexOf(ch) >= 0 ? ' small' : '') + (ch === 'ー' ? ' long' : '');
      return '<span class="' + c + '">' + esc(ch) + '</span>';
    }).join('');
  }
  function readingHtml(list, kun) {
    return list.map(function (r) {
      var p = kun ? r.split('.') : [r];
      return '<span class="rd">' + stackChars(p[0]) + (p[1] ? '<span class="sep" aria-hidden="true"></span>' + stackChars(p[1], 'okuri') : '') + '</span>';
    }).join('');
  }
  // 書き順をくり返し再生する。終わったら1.5秒止めてから最初から。戻り値で止める
  function playLoop(svgs) {
    var me = { stop: false };
    (function play() {
      if (me.stop) return;
      Promise.all(svgs.map(function (svg) { return Ink.animate(Array.from(svg.querySelectorAll('.ink path')), 0.9); }))
        .then(function () { setTimeout(function () {
          if (me.stop) return;
          svgs.forEach(function (svg) { svg.querySelectorAll('.ink path').forEach(function (p) { p.getAnimations().forEach(function (a) { a.cancel(); }); }); });
          play();
        }, 1500); });
    })();
    return function () { me.stop = true; };
  }
  // 左右に読み、中央に字（H: 字の一辺 px、side: 左右それぞれの幅 px）
  function monitorHtml(c, H, side) {
    var k = D.kanji[c];
    return '<div class="kun" aria-label="訓読み" style="font-size:' + readSize(k.kun, H, side) + '">' + readingHtml(k.kun, true) + '</div>' +
      '<div class="mon-kanji" style="width:' + H + 'px;height:' + H + 'px">' + kanjiSvg(c, 'show-svg', true) + '</div>' +
      '<div class="on" aria-label="音読み" style="font-size:' + readSize(k.on, H, side) + '">' + readingHtml(k.on, false) + '</div>';
  }

  // 1字ずつ見る（右に字、左にその字を使ったことば）。←→ で前後、「えらぶ」で問題に出す字にできる
  function viewChars(list, idx, back) {
    clearScreen();
    var c = list[idx], k = D.kanji[c];
    var H = Math.floor(Math.min(window.innerHeight * 0.66, window.innerWidth * 0.36)), side = Math.floor(H * 0.3);
    var words = k.w.map(function (w, i) {
      return '<li><span class="vw">' + wordHtml(w, c) + '</span><span class="vk">' + esc(w[1]) + '</span>' +
        (canSpeak ? '<button class="say" data-i="' + i + '" aria-label="きく">🔊</button>' : '') + '</li>';
    }).join('');
    app.innerHTML =
      '<header class="bar"><button class="back" id="back">もどる</button><span class="prog">' + (idx + 1) + ' / ' + list.length + '</span>' +
      '<span class="nav"><button id="prev"' + (idx ? '' : ' disabled') + '>← ' + K('[前|まえ]') + '</button><button id="next"' + (idx < list.length - 1 ? '' : ' disabled') + '>' + K('[次|つぎ]') + ' →</button></span></header>' +
      '<main class="view"><section class="vwords"><h2>' + esc(c) + K(' を [使|つか]う [言|こと][葉|ば]</h2>') + '<ul>' + words + '</ul>' +
      '<p class="vmeta">' + k.n + K('[画|かく]・') + k.g + '年</p>' +
      '<button class="pick-one" id="pick" aria-pressed="' + Sched.isSel(S.p, c) + '"></button></section>' +
      '<section class="monitor">' + monitorHtml(c, H, side) + '</section></main>';
    function paintPick() { var s = Sched.isSel(S.p, c); var b = $('#pick'); b.setAttribute('aria-pressed', s); b.textContent = s ? K('✓ [選|えら]んでいる（おすと はずす）') : K('☆ この[字|じ]を [選|えら]ぶ'); }
    paintPick();
    cleanup.push(playLoop(Array.from(app.querySelectorAll('.show-svg'))));
    on('#back', back);
    on('#prev', function () { if (idx > 0) viewChars(list, idx - 1, back); });
    on('#next', function () { if (idx < list.length - 1) viewChars(list, idx + 1, back); });
    on('#pick', function () { Sched.setSel(S.p, c, !Sched.isSel(S.p, c), nowMs()); commit(); paintPick(); });
    app.querySelectorAll('.say').forEach(function (b) { b.addEventListener('click', function () { speak(k.w[+b.dataset.i][1]); }); });
    onKey(function (ev) {
      if (ev.key === 'ArrowLeft' && idx > 0) viewChars(list, idx - 1, back);
      else if (ev.key === 'ArrowRight' && idx < list.length - 1) viewChars(list, idx + 1, back);
    });
  }

  // ================= 児童: 問題の始め方（どの字で やるか）
  var KIND_NAME = { read: '[読|よ]む', write: '[書|か]く', fk: 'カード（[漢|かん][字|じ] → [読|よ]み）', fy: 'カード（[読|よ]み → [漢|かん][字|じ]）' };
  function sources(kind) {
    var g = S.grade, order = orderOf(g), n = SIZE[kind], tbl = kind === 'write' ? 'write' : 'read';
    var due = Sched.dueList(S.p, today(), order)[tbl];
    var test = testChars();
    return (test.length ? [{ id: 'test', label: '[次|つぎ]の[漢|かん][字|じ]テストの はんい', sub: S.test.label ? esc(S.test.label) : '', list: shuffle(test.slice()).slice(0, SEL_MAX) }] : []).concat([
      { id: 'due', label: 'おすすめ', sub: '[忘|わす]れそうな[字|じ]', list: due.slice(0, n) },
      { id: 'sel', label: '[選|えら]んだ[漢|かん][字|じ]', sub: '[自|じ][分|ぶん]で [選|えら]んだ[字|じ]', list: Sched.selected(S.p, order).slice(0, SEL_MAX) },
      { id: 'rnd', label: '[習|なら]った[漢|かん][字|じ]から ランダム', sub: '', list: shuffle(learnedChars(g).slice()).slice(0, n) },
      { id: 'miss', label: 'まちがいの [多|おお]い[漢|かん][字|じ]', sub: '', list: Sched.missList(S.p, tbl, order).slice(0, n) }
    ]);
  }
  function chooser(kind) {
    clearScreen();
    var src = sources(kind);
    app.innerHTML =
      '<header class="bar"><button class="back" id="back">もどる</button><span class="prog">' + K(KIND_NAME[kind]) + '・' + S.grade + '年</span><span></span></header>' +
      K('<main class="chooser"><h2>どの[字|じ]で やる？</h2>') + src.map(function (s) {
        return '<button class="big' + (s.list.length ? '' : ' empty') + '" data-id="' + s.id + '"' + (s.list.length ? '' : ' disabled') + '>' + K(s.label) +
          '<span class="meta">' + (s.list.length ? s.list.length + K('[問|もん]') + (s.sub ? '・' + K(s.sub) : '') : K('[今|いま]は ないよ')) + '</span></button>';
      }).join('') + '</main>';
    on('#back', menu);
    app.querySelectorAll('.chooser .big').forEach(function (b) {
      b.addEventListener('click', function () {
        var s = src.filter(function (x) { return x.id === b.dataset.id; })[0];
        startSession(kind, s.list.slice());
      });
    });
  }
  function startSession(kind, list) {
    S.session = { kind: kind, items: list, i: 0, results: {}, startedAt: nowMs() };
    nextItem();
  }
  function nextItem() {
    clearScreen();
    var s = S.session;
    if (s.i >= s.items.length) return sessionDone();
    var c = s.items[s.i];
    s.cur = c;
    if (s.kind === 'read') readCard(c); else if (s.kind === 'write') writeCard(c); else flashCard(c, s.kind === 'fk' ? 'k' : 'y');
  }
  function bar() {
    var s = S.session;
    return '<header class="bar"><button class="back" id="back">やめる</button>' +
      '<span class="prog">' + Math.min(s.i + 1, s.items.length) + ' / ' + s.items.length + '</span><span></span></header>';
  }
  // 途中でやめた回は木に数えない
  function quit() { flush(); menu(); }

  // よむ: 読みをひらがなで入力して機械が採点する（設計書 D3）。答えは送り仮名をのぞいた部分（悪い → わる）。
  // 1回目で正解した時だけ「できた」。間違えたら1回だけ打ち直せ、2回目も違えば答えを見せる。
  function readCard(c) {
    var e = S.p.read[c], w = wordFor(c, e && e[2]);
    var okuri = (w[0].match(/[ぁ-ゖ]+$/) || [''])[0];
    function strip(k) { return okuri && k.slice(-okuri.length) === okuri ? k.slice(0, -okuri.length) : k; }
    var full = [w[1]].concat(w[4] || []), answers = full.map(strip).concat(full); // 送り仮名まで書いても正解にする
    var shown = strip(w[1]);
    app.innerHTML = bar() +
      '<main class="read">' +
      '<div class="card" id="card"><span class="kana" id="kana">' + esc(w[1]) + '</span><span class="word">' + wordHtml(w, c) + '</span></div>' +
      '<form class="answer" id="form" autocomplete="off"><label class="q" for="yomi">' + K('[読|よ]みを ひらがなで [書|か]こう') + (okuri ? K('（[送|おく]りがなは [書|か]かない）') : '') + '</label>' +
      '<div class="answer-row"><input id="yomi" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">' +
      (okuri ? '<span class="okuri-after" aria-label="おくりがな">' + esc(okuri) + '</span>' : '') +

      '<p class="rmsg" id="rmsg" aria-live="polite"></p>' +

      '</main>';
    on('#back', quit);
    var input = $('#yomi'), msg = $('#rmsg'), composing = false, tries = 0, done = false;
    function say(t, cls) { msg.textContent = t; msg.className = 'rmsg' + (cls ? ' ' + cls : ''); }

    function tidy() {

    }

    input.addEventListener('compositionend', function () { composing = false; tidy(); });
    input.addEventListener('input', tidy);
    input.focus();
    $('#form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (done || composing) return;
      var v = Kana.normalize(input.value, true).text;
      input.value = v;
      if (!v) { say('ひらがなで 入れてね'); return; }
      if (answers.indexOf(v) >= 0) return finish(tries === 0, true);
      tries++;
      if (tries < 2) { say(K('× ちがうよ。もう[一|いち][度|ど]'), 'ng'); input.select(); return; }
      finish(false, false);
    });
    on('#idk', function () { if (!done) finish(false, false); });
    function finish(ok, correct) {
      done = true;
      Sched.answerRead(S.p, c, ok, today(), nowMs());
      S.session.results[c] = ok;
      S.session.i++;
      commit();
      input.readOnly = true;
      $('#card').classList.add('flipped');
      speak(w[1]);
      say(correct ? (ok ? K('✓ [正|せい][解|かい]！') : K('✓ [正|せい][解|かい]（2[回|かい]め）')) : K('[答|こた]えは「') + shown + '」' + (okuri ? '（' + okuri + '）' : ''), correct ? 'good' : 'ans');
      $('#after').innerHTML = (canSpeak ? K('<button class="speak" id="speak" type="button">🔊 [聞|き]く</button>') : '') +
        K('<button class="big primary" id="next" type="button">[次|つぎ]へ</button>');

      var next = $('#next'), moved = false;
      function go() { if (moved) return; moved = true; nextItem(); }
      next.addEventListener('click', go);

    }
  }

  // かく: 読みを見て、見本なしで書く。1画ずつ判定。同じ線を2回続けてまちがえたら正しい書き順を見せて「まちがい」で次へ
  function writeCard(c) {
    var e = S.p.write[c], w = wordFor(c, e && e[2]);
    var prompt = Array.from(w[0]).map(function (ch) {
      return ch === c ? '<span class="blank"><ruby><span class="box">　</span><rt>' + esc(w[2]) + '</rt></ruby></span>' : '<span class="ot">' + esc(ch) + '</span>';
    }).join('');
    app.innerHTML = bar() +
      '<main class="write">' +
      '<div class="wl"><p class="prompt">' + prompt + '</p><p class="prompt-kana">' + esc(w[1]) + '</p>' +
      K('<p class="msg" id="msg" aria-live="polite">□の [字|じ]を [書|か]こう</p>') +
      K('<div class="tools"><button id="redo">[書|か]きなおす</button></div></div>') +
      '<div class="padbox" id="pad"></div></main>';
    on('#back', quit);
    var msg = $('#msg'), finished = false;
    function say(t) { msg.textContent = t; }
    function record(ok, note) {
      if (finished) return; finished = true;
      Sched.answerWrite(S.p, c, ok, today(), nowMs());
      S.session.results[c] = ok;
      S.session.i++;
      commit();
      return note;
    }
    var pad = new Ink.Pad($('#pad'), {
      strokes: ST[c], mode: 'free',
      onMiss: function (kind) { say(kind === 'reverse' ? K('[書|か]く [向|む]きが ちがうよ。もう[一|いち][度|ど]') : K('もう[一|いち][度|ど] [書|か]いてみよう')); },
      onStroke: function () { say(''); },
      onStuck: function () {
        record(false);
        say(K('[正|ただ]しい [書|か]き[順|じゅん]を [見|み]よう'));
        pad.demo(0.8).then(function () { pad.mode = 'show'; pad.tplPaths.forEach(function (p) { p.setAttribute('class', 'g-demo'); }); result(false, false); });
      },
      onDone: function (res) {
        var ok = !res.assisted;
        record(ok);
        var after = res.orderMiss > 0 ? (say(K('[字|じ]は できたよ。[書|か]き[順|じゅん]を [見|み]てみよう')), pad.demo(0.8)) : Promise.resolve();
        after.then(function () { result(ok, res.orderMiss > 0); });
      }
    });
    on('#redo', function () { if (!finished) { pad.reset(); say(K('□の [字|じ]を [書|か]こう')); } });
    function result(ok, orderMiss) {
      var box = document.createElement('div');
      box.className = 'result';

  // カード: 答えの入力なし。画面のどこを押しても 答え → 次 と進む（キーは Space・Enter・→）。記録はしない。

  // ================= 先生用（設計書 §5・§13。担当学級だけ。子どもごとの記録は先生画面にだけ出す）
  var ALL_GRADES = [1, 2, 3, 4, 5, 6];
  // 学級キー「学年-組」を「3年1組」の形に

  function dateLabel(ms) {
    if (!ms) return '—';
    var d = new Date(ms), days = Math.floor((Date.now() - ms) / 86400000);
    return (d.getMonth() + 1) + '/' + d.getDate() + (days <= 0 ? '（きょう）' : days <= 6 ? '（' + days + '日前）' : '');
  }
  // 先生画面のデータは学級ごとに1回の通信で読み、学年タブの切り替えでは読み直さない（reuse）。
  // 学級を変えた時・おためしから戻った時は読み直す
  function teacher(klass, tgrade, reuse) {

            kids.map(function (k) {

                '<td>' + k.sessions + '（' + k.items + '）</td><td>' + k.learned + '</td><td class="kmiss">' + esc((k.miss || []).join(' ')) + '</td></tr>';
            }).join('') + '</tbody></table></div><p class="hint">▲＝7日以上 使っていない</p>' : '<p>名簿に この学級の子どもが いません（「名簿」シートの 学年・組 を確認してください）。</p>') + '</section>';

        // 設定は開閉式（押すと開く）。見出しの右に いまの値を出すので、開かなくても状態がわかる。開いた・閉じたは画面を描き直しても保つ

              : tgrade + '年は下の学年なので、全部の字が「習った漢字」です。') + '</p>' +
            (isTop ? '<div class="grid">' + Array.from(order).map(function (c, i) { return '<button class="cell' + (i < pointer ? ' taught' : '') + '" data-i="' + i + '" aria-pressed="' + (i < pointer) + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
              '<p><button id="unset">進度を 未設定にもどす</button></p>' : '')) +
          fold('d-order', tgrade + '年の 出題順', S.orders[tgrade] ? '設定済みの順' : '配当表の順（仮）',
            '<p class="hint">教科書の新出順を貼り付けます。' + tgrade + '年の' + D.grades[tgrade].order.length + '字を順番どおりに（区切りの空白・改行はあってもよい）。</p>' +
            '<textarea id="order" rows="5">' + esc(order) + '</textarea><p><button id="save-order">この順番にする</button> <span id="order-msg" aria-live="polite"></span></p>') +
          '<h3>学級でつまずいている字</h3><p class="hint">よむで答えたことのある児童のうち、最後の答えがまちがいだった児童の割合が高い字（' + st.students + '人中。児童名は出しません）。</p>' +
          (hard.length ? '<ol class="hard">' + hard.map(function (x) { return '<li><span class="hc">' + esc(x.c) + '</span>' + x.s + '人中 ' + x.b + '人（' + Math.round(x.r * 100) + '%）</li>'; }).join('') + '</ol>' : '<p>まだ データが ありません。</p>') +
          '</section>' + kidsHtml;
        app.querySelectorAll('details.tset').forEach(function (d) { d.addEventListener('toggle', function () { S.open[d.id] = d.open; }); });
        var sel = $('#klass'); if (sel) sel.addEventListener('change', function () { teacher(sel.value); });
        // 次の漢字テストの範囲: 押すたびに保存（自動保存）

  // ================= 書き順の提示（先生がモニターに映す）

  var SHOW_MAX = 6;

    clearScreen();

      '<main class="teacher"><p class="picked" id="picked"></p>' +

  function showStart(list, back) {
    var stage = document.createElement('div');
    stage.id = 'stage';
    document.body.appendChild(stage);
    // 全画面: 始める時に入り、Esc 等で抜けても、クリック・キー・右上のボタンでまた全画面に戻る
    function goFull() {
      if (document.fullscreenElement || !document.fullscreenEnabled) return;
      try { document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
    }
    goFull();
    var idx = 0, stopAnim = null, opts = showOpts(), base = opts.base, color = opts.color;
    function stopLoop() { if (stopAnim) { stopAnim(); stopAnim = null; } }
    function single() {
      stopLoop();
      var c = list[idx], k = D.kanji[c], H = window.innerHeight, side = Math.max(120, (window.innerWidth - Math.min(H, window.innerWidth * 0.78)) / 2);
      stage.className = 'single';
      stage.innerHTML = '<div class="kun" aria-label="訓読み" style="font-size:' + readSize(k.kun, H, side) + '">' + readingHtml(k.kun, true) + '</div>' +
        '<div class="big-kanji">' + kanjiSvg(c, 'show-svg', base, color) + '</div>' +
        '<div class="on" aria-label="音読み" style="font-size:' + readSize(k.on, H, side) + '">' + readingHtml(k.on, false) + '</div>' +
        '<div class="stage-pos">' + (idx + 1) + ' / ' + list.length + '</div>';
      placeNums(stage);
      stopAnim = playLoop(Array.from(stage.querySelectorAll('.show-svg')));
    }
    // ならべて表示: 字がいちばん大きくなる行数を選ぶ
    function all() {
      stopLoop();
      // 字と字の間を少し空ける（十字の点線が隣の字とつながって見えないように）
      var W = stage.clientWidth, H = stage.clientHeight, n = list.length, best = { size: 0 }, gap = Math.round(Math.min(W, H) * 0.04);
      for (var rows = 1; rows <= n; rows++) {
        var cols = Math.ceil(n / rows), size = Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows);
        if (size > best.size) best = { size: size, rows: rows, cols: cols };
      }
      stage.className = 'all';
      stage.innerHTML = '<div class="all-grid" style="gap:' + gap + 'px;grid-template-columns:repeat(' + best.cols + ',' + Math.floor(best.size) + 'px);grid-auto-rows:' + Math.floor(best.size) + 'px">' +
        list.map(function (c) { return kanjiSvg(c, 'show-svg', base, color); }).join('') + '</div>';
      placeNums(stage);
      stopAnim = playLoop(Array.from(stage.querySelectorAll('.show-svg')));
    }
    function next() { if (idx < list.length - 1) { idx++; single(); } else if (idx === list.length - 1) { idx++; all(); } }
    function prev() { if (idx > 0) { idx = Math.min(idx, list.length) - 1; single(); } }
    function exit() {
      stopLoop();
      document.removeEventListener('keydown', key);
      document.removeEventListener('fullscreenchange', paintFull);
      full.remove(); x.remove();
      stage.remove();
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
      back();
    }
    function key(ev) {
      if (ev.key !== 'Escape') goFull();
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); prev(); }
      else if (ev.key === 'ArrowRight' || ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); next(); }
      else if (ev.key === 'Escape') exit();
    }
    stage.addEventListener('click', function () { goFull(); next(); });
    document.addEventListener('keydown', key);
    // 全画面でない時だけ出すボタン。埋め込み（GAS）で全画面が許可されていない時は、全画面キーの案内にする
    var full = document.createElement('button');
    full.className = 'stage-full';
    full.textContent = document.fullscreenEnabled ? '⛶ 全画面' : '全画面キー（□）を押してね';
    full.addEventListener('click', function (ev) { ev.stopPropagation(); goFull(); });
    document.body.appendChild(full);
    function paintFull() { full.hidden = !!document.fullscreenElement; }
    document.addEventListener('fullscreenchange', paintFull);
    paintFull();
    var x = document.createElement('button');
    x.className = 'stage-exit'; x.textContent = '×'; x.setAttribute('aria-label', 'おわる');
    document.body.appendChild(x);
    x.addEventListener('click', exit);
    single();
  }

  // ================= 先生のおためし（児童画面を試す。記録はこの端末だけ、サーバーへは送らない）
  function trialBar() {
    var bar = document.getElementById('trial-bar');
    if (!S.trial) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'trial-bar';
      document.body.insertBefore(bar, app);
    }
    bar.innerHTML = '<span class="tb-label">先生のおためし中（記録は この端末だけ）' + (S.dayOffset ? '・' + S.dayOffset + '日後' : '') + '</span>' +
      '<button id="tb-day">1日すすめる</button><button id="tb-reset">はじめから</button><button id="tb-back">先生画面にもどる</button>';
    bar.querySelector('#tb-day').addEventListener('click', function () { S.dayOffset = (S.dayOffset || 0) + 1; trialBar(); menu(); });
    bar.querySelector('#tb-reset').addEventListener('click', function () {
      Platform.resetTrial(); S.p = Sched.newProgress(); S.dayOffset = 0;
      Platform.store.set('kanzi.prevAct.trial.' + S.info.email, 0);
      trialBar(); menu();
    });
    bar.querySelector('#tb-back').addEventListener('click', endTrial);
  }
  function startTrial(klass) {
    // 見せる学年・進度・テスト範囲は、先生画面で読んだ その学級のもの（読み直さない）
    var v = S.view && S.view.klass === klass ? Promise.resolve(S.view) : Platform.teacherView(klass);
    v.then(function (view) {
      S.trial = true;
      S.test = view.test || null;
      S.grades = view.grades.map(Number).sort(function (a, b) { return a - b; }); S.grade = maxGrade(); S.pointers = view.pointers || {};
      S.p = Platform.startTrial(S.info.email);
      S.dayOffset = 0;
      trialBar();
      menu();
    }, function (e) { alert('ひらけませんでした: ' + (e && e.message || e)); });
  }
  function endTrial() {
    S.trial = false; S.p = null; S.dayOffset = 0;
    Platform.endTrial();
    trialBar();
    teacher(S.klass);
  }

  // ================= 起動
  Platform.init().then(function (info) {
    S.info = info;
    S.orders = info.orders || {};
    S.pointers = info.pointers || {};
    S.test = info.test || null;
    S.grades = (info.grades && info.grades.length ? info.grades : [3]).map(Number).sort();
    S.grade = maxGrade();
    if (info.role === 'teacher') return teacher();
    if (info.role !== 'student') {
      app.innerHTML = '<main class="done"><p>このアカウントでは つかえません。学校のアカウントで ひらいてね。</p></main>';
      return;
    }
    S.p = Sched.norm(info.progress);
    menu();
  }).catch(function () {
    app.innerHTML = '<main class="done"><p>よみこめませんでした。</p><button class="big primary" onclick="location.reload()">もういちど ひらく</button></main>';
  });
})();
</script>
</body>
</html>
